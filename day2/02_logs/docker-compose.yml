services:
  www:
    image: httpd
    ports:
      - "80:80"
    depends_on: 
      - syslog
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        tag: "http"

  syslog:
    image: voxxit/rsyslog
    # Obraz nie ma manifestu arm64 — bez tego na Apple Silicon pull pada
    # ("no matching manifest for linux/arm64/v8"). Emulacja amd64 wystarcza.
    platform: linux/amd64
    ports:
        - "5514:514/udp"
