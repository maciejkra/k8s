# cert-manager + Let's Encrypt — ścieżka PRODUKCYJNA (NIE zadziała z localhost).
#
# HTTP-01 challenge wymaga, żeby Let's Encrypt dosięgnął http://<dnsName>/.well-known/...
# od strony internetu — czyli potrzebny PUBLICZNY IP i domena nań wskazująca
# (np. app.<TWOJ-PUBLICZNY-IP>.nip.io). Z 127.0.0.1 to się nie uda — lokalnie
# używaj tls/certmanager-selfsigned.yaml.
#
# Dodatkowo dla Gateway API cert-manager musi mieć włączony gateway-shim
# (solver tworzy HTTPRoute). Patrz ../README.md → sekcja TLS (jak włączyć bez Helma).
#
# UWAGA — poniżej jest PLACEHOLDER <GATEWAY-IP>. Podstaw adres SWOJEGO Gatewaya, inaczej
# LE będzie walidować cudzy host. Gotowy przepis: ../README.md (Przykład 4C).
#
#   IP=$(kubectl get gateway training-gateway -o jsonpath='{.status.addresses[0].value}')
#   sed "s/<GATEWAY-IP>/$IP/g" tls/certmanager-letsencrypt.yaml | kubectl apply -f -
#
# Używamy od razu prod — chcemy zaufany cert (zielona kłódka, curl bez -k). Cena: limit LE
# to 5 NIEUDANYCH walidacji na godzinę na hostname, więc najpierw pre-flight z README (4C).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: maciejkra@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: training-gateway
                namespace: default
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: default
spec:
  secretName: app-tls
  privateKey:
    rotationPolicy: Always       # od cert-manager v1.18 to nowy default — ustawiamy jawnie, by wyciszyć warning
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.<GATEWAY-IP>.nip.io    # musi wskazywać na Twój publiczny IP
  duration: 2160h               # 90 dni
  renewBefore: 360h             # odnowienie 15 dni przed wygaśnięciem

---
# WAŻNE — sam cert nie wystarczy, żeby coś się wyświetliło po HTTPS.
# Lokalne HTTPRoute'y (demo/nginx/echo) są na hostname `127-0-0-1`, więc NIE złapią
# domeny z publicznym IP. Do realnego serwowania appki po TLS potrzebujesz HTTPRoute
# z TĄ SAMĄ domeną co w certyfikacie wyżej:
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-public
  namespace: default
spec:
  parentRefs:
    - name: training-gateway
  hostnames:
    - app.<GATEWAY-IP>.nip.io   # = dnsNames z Certificate
  rules:
    - backendRefs:
        - name: demo-app        # nginx z backends.yaml
          port: 80
