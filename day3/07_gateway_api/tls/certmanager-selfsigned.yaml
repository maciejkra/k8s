# cert-manager — issuer typu selfSigned. DZIAŁA LOKALNIE (kind / Docker Desktop),
# bez publicznego IP i bez Helma. cert-manager sam wystawia cert i wrzuca go do
# Secretu `app-tls` (typ kubernetes.io/tls) — dokładnie tego, którego oczekuje
# gateway-https.yaml. To pokazuje, co cert-manager AUTOMATYZUJE w stosunku do
# ręcznego openssl-a z tls/README.md (produkcja Secretu + późniejszy renewal).
#
# Instalacja cert-managera (bez Helma) — patrz ../README.md, sekcja TLS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: default
spec:
  secretName: app-tls          # cert-manager utworzy ten Secret (kubernetes.io/tls)
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  # Bez commonName cert ma PUSTE pola subject i issuer (cert-manager wypełnia tylko SAN-y),
  # a wtedy `curl -kv` pokazuje `subject: [NONE]` i w ogóle nie drukuje linii `issuer:` —
  # nie da się na nim pokazać, że subject == issuer (patrz task.md, Część 4).
  commonName: demo.127-0-0-1.nip.io
  dnsNames:
    - demo.127-0-0-1.nip.io
    - nginx.127-0-0-1.nip.io
    - echo.127-0-0-1.nip.io
