# Loki na kind — tryb SingleBinary.
# Chart grafana/loki domyslnie stawia wariant rozproszony, ktory oczekuje object
# storage (S3/GCS) i memcached — na kind nie wstanie. Ponizsze wartosci sprowadzaja
# go do jednego Poda z lokalnym filesystemem.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
